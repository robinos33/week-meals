# Dictionnaire des ingrédients — vocabulaire de référence de Week Meals.
#
# Il sert trois choses :
#
#   1. **Rapprocher** les formulations des recettes d'un nom canonique unique
#      (« Courgettes », « grosses courgettes bio » → `courgette`), pour que la
#      liste de courses ne montre qu'une ligne par produit — sans confondre
#      deux produits différents (cf. « déclinaisons » plus bas).
#   2. **Convertir** les grammages en unités achetables : 600 g de courgettes
#      → 3 courgettes (arrondi supérieur).
#   3. **Suggérer** les noms à la saisie manuelle, avec le bon rayon et la
#      bonne unité.
#
# Champs :
#
# - `name`            : nom canonique, celui qui s'affiche dans la liste.
# - `category`        : **rayon**, pour le regroupement et le tri par magasin.
#                       Le catalogue est fermé (`domain::aisle` côté serveur,
#                       et un test le vérifie sur ce fichier) : `fruits`,
#                       `legumes`, `boulangerie`, `boucherie`, `charcuterie`,
#                       `poissonnerie`, `cremerie`, `surgeles`,
#                       `epicerie-salee`, `epicerie-sucree`, `condiments`,
#                       `boissons`, `hygiene`, `entretien`, `maison`, `bebe`,
#                       `animaux`.
# - `avg_weight_g`    : poids moyen d'une pièce, en grammes. **Facultatif** :
#                       sans lui, l'ingrédient reste dans son unité d'origine
#                       (farine, lait, huile…) — il garde tout de même son nom
#                       canonique, ses synonymes et son rayon.
# - `countable: true` : s'achète et s'affiche **toujours** en pièces (œufs…),
#                       jamais reconverti en grammes.
# - `unit`            : unité proposée à la saisie manuelle (`g`, `kg`, `ml`,
#                       `l`, `piece`). Défaut : `piece` avec un poids moyen,
#                       `g` sinon.
# - `aliases`         : **autres noms du même achat** (« ognon », « lime »,
#                       « escalope de poulet »). Inutile d'y mettre les
#                       pluriels, les accents ou les majuscules — le
#                       rapprochement les gère seul, de même que les
#                       qualificatifs qui ne changent pas le produit (« bio »,
#                       « frais », « grosses », « bien mûres »…) et les fautes
#                       de frappe proches (« échalotte » → « échalote »).
#
# ## Rayons : le découpage d'un magasin, pas celui d'un livre de cuisine
#
# Le rayon sert à **trier la liste dans l'ordre de visite** d'un magasin (cf.
# les magasins dans les paramètres). Il suit donc les allées réelles plutôt que
# les familles d'aliments : l'« épicerie » d'un supermarché n'est pas une allée
# mais trois — salée, sucrée, condiments —, les herbes fraîches sont au rayon
# légumes quand le thym séché est aux condiments, et la pâte feuilletée est au
# frais, près de la crèmerie.
#
# Le dictionnaire ne contient pas que de l'alimentaire : ce qui se met dans le
# même caddie a sa place ici (papier toilette, lessive, piles, croquettes…).
# Ces produits n'arrivent jamais d'une recette — ils viennent de la saisie
# manuelle — mais y figurer leur donne l'auto-complétion, l'unité et le rayon.
#
# ## Déclinaisons : une entrée par produit réellement différent
#
# Une **couleur nomme une variété**, pas un état : « poivron rouge », « poivron
# jaune » et « poivron » sont trois courses distinctes, et chacune a donc SON
# entrée ici. Il en va de même de tout ce qui change ce qu'on met dans le
# caddie : « oignon nouveau », « abricot sec », « café moulu », « lait de
# coco ». Mettre l'une en `aliases` d'une autre les ferait fusionner — et
# acheter le mauvais produit.
#
# À l'inverse, une formulation qui désigne bien le produit générique a sa place
# en `aliases` (« salade verte » → `salade`).
#
# Une déclinaison absente d'ici n'est jamais rabattue de force sur le générique :
# elle reste dans la liste sous le nom saisi, simplement sans rayon. L'ajouter
# ici lui donne son rayon et la fait remonter dans les suggestions.
#
# Fichier versionné, source de vérité : il est rejoué en base (upsert par nom)
# au démarrage du serveur et par `weekmeals seed-ingredients`.

