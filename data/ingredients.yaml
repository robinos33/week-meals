# Dictionnaire des ingrédients — vocabulaire de référence de Week Meals.
#
# Il sert trois choses :
#
#   1. **Rapprocher** les formulations des recettes d'un nom canonique unique
#      (« Courgettes », « courgette jaune », « courgettes » → `courgette`), pour
#      que la liste de courses ne montre qu'une ligne par produit.
#   2. **Convertir** les grammages en unités achetables : 600 g de courgettes
#      → 3 courgettes (arrondi supérieur).
#   3. **Suggérer** les noms à la saisie manuelle, avec le bon rayon et la
#      bonne unité.
#
# Champs :
#
# - `name`            : nom canonique, celui qui s'affiche dans la liste.
# - `category`        : rayon, pour le regroupement (`legumes`, `fruits`,
#                       `cremerie`, `boucherie`, `poissonnerie`, `epicerie`,
#                       `boulangerie`, `surgeles`, `boissons`, `entretien`).
# - `avg_weight_g`    : poids moyen d'une pièce, en grammes. **Facultatif** :
#                       sans lui, l'ingrédient reste dans son unité d'origine
#                       (farine, lait, huile…) — il garde tout de même son nom
#                       canonique, ses synonymes et son rayon.
# - `countable: true` : s'achète et s'affiche **toujours** en pièces (œufs…),
#                       jamais reconverti en grammes.
# - `unit`            : unité proposée à la saisie manuelle (`g`, `kg`, `ml`,
#                       `l`, `piece`). Défaut : `piece` avec un poids moyen,
#                       `g` sinon.
# - `aliases`         : synonymes et formulations rencontrées dans les
#                       recettes. Inutile d'y mettre les pluriels, les accents
#                       ou les majuscules — le rapprochement les gère seul, de
#                       même que les qualificatifs (« bio », « frais »,
#                       « jaune », « surgelé »…) et les fautes de frappe
#                       proches (« échalotte » → « échalote »).
#
# Fichier versionné, source de vérité : il est rejoué en base (upsert par nom)
# au démarrage du serveur et par `weekmeals seed-ingredients`.

