# fly.toml app configuration file generated for week-meals on 2026-11-07T20:40:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'week-meals'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTH_MODE = 'locked'
  DATABASE_URL = 'sqlite:///data/weekmeals.db'
  PHOTO_STORAGE_DIR = '/data/photos'
  RUST_LOG = 'info'
  SESSION_SAME_SITE = 'lax'
  SESSION_SECURE = '1'

[[mounts]]
  source = 'weekmeals_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
